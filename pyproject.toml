[project]
name = "hello-robot-stretch4-kinematics"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hello-robot-stretch4-urdf>=2026.5.27",
    "hello-robot-stretch4-body",
    "numpy>=2.2.6",
    "pin>=4.0.0",
    "yourdfpy>=0.0.60",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["stretch4_kinematics*"]

[tool.uv.sources]
hello-robot-stretch4-urdf = { workspace = true }
hello-robot-stretch4-body = { workspace = true }
